<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For You, My Love ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: #5b1730;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.95), transparent 28%),
        radial-gradient(circle at 85% 10%, rgba(255,196,218,.8), transparent 30%),
        linear-gradient(135deg, #fff7fa 0%, #ffe4ed 48%, #fff3f7 100%);
    }

    .page {
      position: relative;
      z-index: 2;
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 65px 0 55px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #b43b65;
    }

    h1 {
      margin: 0 auto;
      max-width: 850px;
      font-size: clamp(42px, 8vw, 82px);
      line-height: 1;
      font-weight: 500;
    }

    .subtitle {
      max-width: 650px;
      margin: 24px auto 48px;
      font-family: Arial, sans-serif;
      font-size: 17px;
      line-height: 1.8;
      color: #7c4257;
    }

    .gift-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px 22px;
      max-width: 950px;
      margin: 0 auto;
    }

    .gift {
      border: 0;
      padding: 15px 8px;
      background: transparent;
      cursor: pointer;
      color: inherit;
      font-family: Arial, sans-serif;
      transition: transform .3s ease;
    }

    .gift:hover {
      transform: translateY(-12px);
    }

    .gift:focus-visible {
      outline: 3px solid #e78aa7;
      outline-offset: 5px;
      border-radius: 15px;
    }

    .gift-box {
      position: relative;
      width: 135px;
      height: 120px;
      margin: 0 auto 15px;
      filter: drop-shadow(0 16px 13px rgba(104, 25, 52, .18));
      transition: transform .3s ease;
    }

    .gift:hover .gift-box {
      transform: rotate(-2deg) scale(1.04);
    }

    .box-body {
      position: absolute;
      left: 7px;
      right: 7px;
      bottom: 0;
      height: 78px;
      border-radius: 7px;
      background: linear-gradient(135deg, #ec668f, #bb2e5d);
    }

    .box-lid {
      position: absolute;
      left: 0;
      right: 0;
      top: 25px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #f78aab, #dd4d7a);
      z-index: 3;
    }

    .ribbon-v {
      position: absolute;
      top: 25px;
      bottom: 0;
      left: 54px;
      width: 28px;
      background: #ffd76a;
      z-index: 4;
    }

    .ribbon-h {
      position: absolute;
      left: 7px;
      right: 7px;
      top: 55px;
      height: 18px;
      background: #ffd76a;
      z-index: 4;
    }

    .bow {
      position: absolute;
      left: 43px;
      top: 0;
      width: 50px;
      height: 38px;
      z-index: 6;
    }

    .bow:before,
    .bow:after {
      content: "";
      position: absolute;
      top: 5px;
      width: 30px;
      height: 23px;
      background: #ffd76a;
      border-radius: 75% 25% 70% 25%;
    }

    .bow:before {
      left: 0;
      transform: rotate(25deg);
    }

    .bow:after {
      right: 0;
      transform: scaleX(-1) rotate(25deg);
    }

    .bow-center {
      position: absolute;
      left: 19px;
      top: 9px;
      width: 13px;
      height: 18px;
      border-radius: 50%;
      background: #efbb38;
    }

    .gift-title {
      display: block;
      font-weight: 700;
      font-size: 15px;
      color: #76213f;
    }

    .gift-small {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      color: #a25870;
    }

    .message-card {
      display: none;
      position: relative;
      max-width: 720px;
      margin: 55px auto 0;
      padding: 48px 32px 40px;
      border: 1px solid rgba(181, 45, 91, .15);
      border-radius: 30px;
      background: rgba(255,255,255,.82);
      box-shadow: 0 25px 80px rgba(91, 23, 48, .16);
      backdrop-filter: blur(12px);
      animation: cardIn .55s ease;
    }

    .message-card.show {
      display: block;
    }

    .message-heart {
      font-size: 78px;
      line-height: 1;
      animation: heartbeat 1.15s infinite;
    }

    .message-card h2 {
      margin: 18px 0 12px;
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 500;
    }

    .message-card p {
      margin: 0 auto 25px;
      max-width: 600px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.85;
      color: #754155;
    }

    .close-button {
      border: 0;
      padding: 12px 25px;
      border-radius: 999px;
      background: #b52d5b;
      color: #fff;
      font-family: Arial, sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    .close-button:hover {
      transform: scale(1.05);
      background: #962247;
    }

    .footer {
      margin: 55px 0 0;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #a34b68;
    }

    .floating-heart {
      position: fixed;
      left: 0;
      bottom: -40px;
      z-index: 1;
      pointer-events: none;
      opacity: .5;
      animation: floatUp linear forwards;
    }

    .burst-heart {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      font-size: 22px;
      animation: burst 1.1s ease-out forwards;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      15% {
        transform: scale(1.18);
      }

      30% {
        transform: scale(1);
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(25px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: .5;
      }

      to {
        transform: translateY(-115vh) rotate(25deg);
        opacity: 0;
      }
    }

    @keyframes burst {
      from {
        transform: translate(0, 0) scale(.7);
        opacity: 1;
      }

      to {
        transform: translate(var(--x), var(--y)) scale(1.4);
        opacity: 0;
      }
    }

    @media (max-width: 800px) {
      .gift-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 25px 12px;
      }
    }

    @media (max-width: 430px) {
      .page {
        padding-top: 45px;
      }

      .gift-box {
        width: 110px;
        height: 100px;
      }

      .ribbon-v {
        left: 44px;
      }

      .bow {
        left: 33px;
      }

      .message-card {
        padding: 40px 22px 32px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <p class="eyebrow">A little surprise for you ✨</p>

    <h1>For You, My Love ❤️</h1>

    <p class="subtitle">
      I made these little gifts because sometimes words are not enough
      to tell someone how special they are.
      Open them one by one... 💕
    </p>

    <section class="gift-grid" id="giftGrid"></section>

    <section class="message-card" id="messageCard" aria-live="polite">

      <div class="message-heart">❤️</div>

      <h2 id="messageTitle"></h2>

      <p id="messageText"></p>

      <button class="close-button" id="closeButton">
        Close 💕
      </button>

    </section>

    <p class="footer">
      Made with love, especially for you ❤️
    </p>

  </main>

  <script>
    /*
     * ==========================================
     * EDIT YOUR GIFTS HERE
     * ==========================================
     *
     * You can change the title and message
     * of every gift box.
     */

    const gifts = [
      {
        title: 'Our Beginning 💌',
        small: 'Open me',
        message: 'Do you remember how everything started? I may not know exactly what the future had planned for us, but I am so grateful that our paths crossed.'
      },
      {
        title: 'Why You? 🌸',
        small: 'A little secret',
        message: 'Because you make ordinary moments feel special. Your smile, your little habits, your kindness... somehow they all became my favorite things.'
      },
      {
        title: 'My Favorite Person 🥰',
        small: 'Open me',
        message: 'In a world full of people, you became the person I want to tell everything to, laugh with, annoy a little, and make beautiful memories with.'
      },
      {
        title: 'One Promise 💍',
        small: 'From my heart',
        message: 'I cannot promise that every day will be perfect. But I can promise that I will always try to make you feel loved, valued, respected, and important.'
      },
      {
        title: 'When You Miss Me 💕',
        small: 'Open when needed',
        message: 'If you ever miss me, remember that somewhere there is a person smiling just because you exist. Close your eyes, take a breath, and imagine a big hug from me.'
      },
      {
        title: 'For Your Smile 😊',
        small: 'Something sweet',
        message: 'Your smile has a way of making everything feel a little lighter. So please keep smiling... especially when you look at me.'
      },
      {
        title: 'Our Future ✨',
        small: 'A tiny dream',
        message: 'I want more silly conversations, more memories, more adventures, more photographs, more celebrations, and many more ordinary days together.'
      },
      {
        title: 'The Final Gift 🎁',
        small: 'Open last',
        message: 'You are not just a chapter in my story. You are one of the most beautiful parts of it. If I had to choose again, I would still choose you. I love you. ❤️'
      }
    ];

    const giftGrid = document.getElementById('giftGrid');
    const messageCard = document.getElementById('messageCard');
    const messageTitle = document.getElementById('messageTitle');
    const messageText = document.getElementById('messageText');
    const closeButton = document.getElementById('closeButton');

    function createGiftBox(gift, index) {
      const button = document.createElement('button');

      button.type = 'button';
      button.className = 'gift';
      button.setAttribute('aria-label', 'Open ' + gift.title);

      button.innerHTML =
        '<div class="gift-box">' +
          '<div class="bow">' +
            '<div class="bow-center"></div>' +
          '</div>' +
          '<div class="box-lid"></div>' +
          '<div class="box-body"></div>' +
          '<div class="ribbon-v"></div>' +
          '<div class="ribbon-h"></div>' +
        '</div>' +
        '<span class="gift-title">' + gift.title + '</span>' +
        '<span class="gift-small">' + gift.small + '</span>';

      button.addEventListener('click', function() {
        openGift(index, button);
      });

      giftGrid.appendChild(button);
    }

    function openGift(index, button) {
      messageTitle.textContent = gifts[index].title;
      messageText.textContent = gifts[index].message;

      messageCard.classList.remove('show');

      setTimeout(function() {
        messageCard.classList.add('show');

        messageCard.scrollIntoView({
          behavior: 'smooth',
          block: 'center'
        });
      }, 40);

      createHeartBurst(button);
    }

    function createHeartBurst(button) {
      const rect = button.getBoundingClientRect();

      for (let i = 0; i < 14; i++) {
        const heart = document.createElement('div');

        heart.className = 'burst-heart';
        heart.textContent = i % 2 === 0 ? '❤' : '♡';

        heart.style.left = (rect.left + rect.width / 2) + 'px';
        heart.style.top = (rect.top + rect.height / 2) + 'px';

        heart.style.setProperty('--x', ((Math.random() - .5) * 220) + 'px');
        heart.style.setProperty('--y', ((Math.random() - .5) * 180 - 50) + 'px');

        document.body.appendChild(heart);

        setTimeout(function() {
          heart.remove();
        }, 1200);
      }
    }

    closeButton.addEventListener('click', function() {
      messageCard.classList.remove('show');
    });

    for (let i = 0; i < gifts.length; i++) {
      createGiftBox(gifts[i], i);
    }

    function createFloatingHeart() {
      const heart = document.createElement('div');

      heart.className = 'floating-heart';
      heart.textContent = Math.random() > .5 ? '♡' : '♥';

      heart.style.left = (Math.random() * 100) + 'vw';
      heart.style.fontSize = (14 + Math.random() * 24) + 'px';
      heart.style.animationDuration = (5 + Math.random() * 6) + 's';

      document.body.appendChild(heart);

      setTimeout(function() {
        heart.remove();
      }, 12000);
    }

    setInterval(createFloatingHeart, 850);
  </script>

</body>
</html>
